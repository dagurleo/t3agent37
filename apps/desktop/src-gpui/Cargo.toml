[package]
name = "t3agent37-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "t3agent37's menu-bar app on GPUI: the panel drawn natively, no webview"

[[bin]]
name = "t3agent37"
path = "src/main.rs"

[dependencies]
# The backend, without its Tauri shell.
t3agent37 = { path = "../src-tauri", default-features = false }
gpui-kit = "0.10.0"
raw-window-handle = "0.6"
futures = "0.3"
image = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cc = "1"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
