[package]
name = "t3agent37"
version = "0.1.0"
description = "Auto-sleeping T3 Code remote machines on your Agent37 Cloud account"
license = "MIT"
edition = "2024"
default-run = "t3agent37"

[lib]
name = "t3agent37_lib"

[[bin]]
name = "t3agent37"
path = "src/main.rs"
required-features = ["tauri-app"]

# The Tauri shell (tray.rs). Without it this is the backend alone, which the GPUI app
# (`../src-gpui`) builds on.
[features]
default = ["tauri-app"]
tauri-app = [
    "dep:tauri",
    "dep:tauri-build",
    "dep:tauri-plugin-autostart",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-notification",
    "dep:gdkx11",
    "dep:gtk",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
which = "7"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
bytes = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
