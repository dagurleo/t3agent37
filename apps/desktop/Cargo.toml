[package]
name = "t3agent37"
version = "0.1.10"
description = "Auto-sleeping T3 Code remote machines on your Agent37 Cloud account"
license = "MIT"
edition = "2024"
publish = false
default-run = "t3agent37"

# The backend: Agent37, the machines, the T3 proxy, MCP. UI-agnostic; the menu-bar app and the
# `t3agent37` command (src/bin/t3agent37) and the headless dev driver (src/bin/t3agent37-dev.rs)
# all run it.
[lib]
name = "t3agent37_lib"

[features]
default = ["panel"]
# The menu-bar app's panel (GPUI, and the AppKit side in macos/shell.m). Without it the binary is
# the `t3agent37` command alone: `cargo build --release --no-default-features`, for Linux, or a
# Mac without the app.
panel = ["dep:gpui-kit", "dep:raw-window-handle", "dep:futures", "dep:image"]

[dependencies]
# backend
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
which = "7"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
urlencoding = "2"
bytes = "1"
sha2 = "0.10"
flate2 = "1"
# the menu-bar app (the `panel` feature)
gpui-kit = { version = "0.10.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
futures = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false, optional = true }

[build-dependencies]
cc = "1"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
