# Each pull request (and main) checked: the app built and its tests run on a Mac, the command
# alone (no panel) built and tested on Linux, and the site type-checked and built.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# (A pull request's newer push cancels its older run; main's runs all finish.)
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  app:
    name: App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      # (The toolchain rust-toolchain.toml pins, Rust 1.99.)
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Test
        run: cargo test --locked

  command:
    name: Command on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop
      - name: Test
        run: cargo test --locked --no-default-features

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/web
        run: bun run build
